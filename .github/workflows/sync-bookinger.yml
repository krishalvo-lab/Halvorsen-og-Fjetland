name: Synk bookinger fra kalender

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bookinger
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent kalender
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: python scripts/sync_bookinger.py

      - name: Hent prisliste (reserve hvis admin er nede)
        run: |
          if curl -fsS --max-time 20 https://admin.halvorsenogfjetland.no/priser.php -o ny.json && python -c "import json; assert 'maskiner' in json.load(open('ny.json'))"; then
            python -c "import json; json.dump(json.load(open('ny.json')), open('priser.json', 'w'), ensure_ascii=False, indent=1, sort_keys=True)"
          else
            echo "Fikk ikke hentet prislista – beholder priser.json."
          fi
          rm -f ny.json

      - name: Lagre endringer
        run: |
          if git diff --quiet bookinger.json priser.json; then
            echo "Ingen endringer."
            exit 0
          fi
          git config user.name "booking-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookinger.json priser.json
          git commit -m "Oppdater ledighet og priser"
          git push
