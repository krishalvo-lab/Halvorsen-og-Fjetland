# Reservekopi av ledighet og priser. Nettsiden henter begge direkte fra admin;
# bookinger.json og priser.json brukes bare hvis admin ikke svarer.
name: Synk ledighet og priser fra admin

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bookinger
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hent ledighet og priser (beholder forrige kopi hvis admin er nede)
        run: |
          hent() { # hent <adresse> <fil> <innrykk> <python-sjekk av d>
            if curl -fsS --max-time 20 "$1" -o ny.json && python3 -c "import json; d = json.load(open('ny.json')); assert $4"; then
              python3 -c "import json; f = open('$2', 'w', encoding='utf-8'); json.dump(json.load(open('ny.json')), f, ensure_ascii=False, indent=$3, sort_keys=$5); f.write('\n')"
            else
              echo "Fikk ikke hentet $1 – beholder $2."
            fi
            rm -f ny.json
          }
          hent https://admin.halvorsenogfjetland.no/ledighet.php bookinger.json 2 "isinstance(d, dict) and d and all(isinstance(v, list) for v in d.values())" False
          hent https://admin.halvorsenogfjetland.no/priser.php priser.json 1 "'maskiner' in d" True

      - name: Lagre endringer
        run: |
          if git diff --quiet bookinger.json priser.json; then
            echo "Ingen endringer."
            exit 0
          fi
          git config user.name "booking-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookinger.json priser.json
          git commit -m "Oppdater ledighet og priser"
          git push
